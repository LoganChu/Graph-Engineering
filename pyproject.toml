[project]
name = "memory-arena"
version = "0.1.0"
description = "A benchmark harness for agent memory architectures: same loop, same tasks, pluggable memory."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "networkx>=3.2",
    "matplotlib>=3.8",
    "rich>=13.0",
]

[project.optional-dependencies]
# The vector backend needs local embeddings. Kept optional so the base install
# stays light and offline-runnable.
embeddings = ["sentence-transformers>=3.0"]
local = [
    "openai>=3.3.1",
]
# The orchestration axis. LangChain/LangGraph are only needed for the `loop`
# and `graph` orchestrators; `single_shot` (the historical behaviour) has no
# such dependency, so the base install stays offline-runnable.
orchestration = [
    "langchain>=1.0",
    "langgraph>=1.0",
]

[project.scripts]
arena = "arena.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arena"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
