id: oncall
description: >
  Operational chatter from a small team over four months. Ownership changes
  hands, a root cause is revised after the fact, and counts have to be assembled
  from turns that never appear together. Tests aggregation and belief revision
  on technical content rather than personal facts.

turns:
  - t: 2025-09-02
    speaker: dana
    text: "Checkout service paged at 3am. Latency spike on the payments call."
  - t: 2025-09-02
    speaker: dana
    text: "Initial read is a connection pool exhaustion in the payments client."
  - t: 2025-09-04
    speaker: dana
    text: "Raised the pool size to 200. Latency is back to normal."
  - t: 2025-09-15
    speaker: sam
    text: "I own the checkout service now. Dana moved to the platform team."
  - t: 2025-09-28
    speaker: sam
    text: "Checkout paged again. Same latency shape as the September 2nd incident."
  - t: 2025-10-01
    speaker: sam
    text: "It was never the pool. Root cause is a retry storm from the mobile client."
  - t: 2025-10-03
    speaker: sam
    text: "Added exponential backoff to the mobile retry path. Shipped in 4.2.1."
  - t: 2025-10-19
    speaker: sam
    text: "Search service paged, unrelated. Bad index rebuild, took 40 minutes."
  - t: 2025-11-04
    speaker: sam
    text: "Rolled the pool size back to 50 since it was never the actual problem."
  - t: 2025-11-12
    speaker: priya
    text: "I'm taking over search from Ade. Ade is going on leave until February."
  - t: 2025-11-30
    speaker: sam
    text: "Checkout paged, third time. This one was a bad deploy, rolled back in 8 minutes."
  - t: 2025-12-08
    speaker: priya
    text: "Search paged again, same index rebuild issue as October. Needs a real fix."
  - t: 2025-12-20
    speaker: sam
    text: "Freeze starts today. No deploys until January 5th."
  - t: 2026-01-14
    speaker: sam
    text: "Handing checkout to Priya. I'm moving to the payments team."

probes:
  - after_turn: 3
    type: simple_recall
    question: "What was the initial root cause of the September 2nd checkout page?"
    expected: "Connection pool exhaustion in the payments client."

  - after_turn: 7
    type: contradiction
    question: "What actually caused the checkout latency incidents?"
    expected: "A retry storm from the mobile client, not pool exhaustion."
    must_not_contain: ["pool exhaustion"]

  - after_turn: 12
    type: aggregation
    question: "How many times did the checkout service page?"
    expected: "Three times: September 2nd, September 28th, and November 30th."

  - after_turn: 12
    type: multi_hop
    question: "Who owned the search service when it paged in December, and who owned it before them?"
    expected: "Priya owned it in December; Ade owned it before going on leave."

  - after_turn: 12
    type: temporal
    question: "Who owned the checkout service?"
    expected: "Dana"
    as_of: 2025-09-10

  - after_turn: 14
    type: contradiction
    question: "Who owns the checkout service?"
    expected: "Priya"
    must_not_contain: ["Dana"]

  - after_turn: 14
    type: simple_recall
    question: "Which release contained the mobile retry backoff fix?"
    expected: "4.2.1"

  - after_turn: 14
    type: negation
    question: "What was the postmortem action item for the search index rebuild?"
    expected: "Never stated -- the correct answer is that this is unknown."

  - after_turn: 14
    type: aggregation
    question: "Which services paged during this period?"
    expected: "Checkout and search."
